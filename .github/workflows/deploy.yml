name: Auto Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > github_key
          chmod 600 github_key

      - name: Deploy to GCP VM
        env:
          GCP_VM_IP: ${{ secrets.GCP_VM_IP }}
          GCP_SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i github_key $GCP_SSH_USER@$GCP_VM_IP << 'EOF'
            set -Eeuo pipefail
            cd ~/lenaai-website

            echo "🔧 Fixing git permissions and removing stale lock files..."
            # Remove any stale git lock files that might prevent git operations
            rm -f .git/config.lock .git/index.lock .git/refs/heads/main.lock 2>/dev/null || true
            
            # Ensure correct ownership of .git directory (if we have permissions)
            CURRENT_USER=$(whoami)
            chown -R $CURRENT_USER:$CURRENT_USER .git 2>/dev/null || true
            
            # Fix permissions on .git directory to ensure it's writable
            chmod -R u+rw .git 2>/dev/null || true
            
            # Verify git is working
            git status >/dev/null 2>&1 || {
              echo "⚠️  Git status check failed, attempting to fix..."
              # If git status fails, try to reset the repository state
              git reset --hard HEAD 2>/dev/null || true
            }

            echo "📥 Pulling latest changes..."
            git config pull.rebase false
            git pull origin main --no-rebase
            echo "🧹 Stopping old container if exists..."
            docker rm -f lenaai_nextjs_app || true

            echo "🔧 Ensure shared Docker network exists..."
            docker network inspect lenaai_network >/dev/null 2>&1 || \
              docker network create lenaai_network

            echo "🔨 Building the new image..."
            docker build -t lenaai_nextjs_app .

            echo "🚀 Running new container in lenaai_network..."
            docker run -d \
              --restart=always \
              --name lenaai_nextjs_app \
              --network lenaai_network \
              -p 3002:3000 \
              lenaai_nextjs_app
          EOF
