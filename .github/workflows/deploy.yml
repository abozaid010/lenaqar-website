name: Auto Deploy to GCP (Secure IAP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  VM_NAME: ${{ secrets.GCP_VM_NAME }}
  VM_SSH_USER: abozaid
  # Keep IAP SSH tunnels alive during long Docker/Next.js builds
  SSH_KEEPALIVE: -o ConnectTimeout=300 -o ServerAliveInterval=30 -o ServerAliveCountMax=10

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Provision gcloud SSH keys (fixed deploy key)
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/google_compute_engine
          chmod 600 ~/.ssh/google_compute_engine

          ssh-keygen -y -f ~/.ssh/google_compute_engine > ~/.ssh/google_compute_engine.pub
          chmod 644 ~/.ssh/google_compute_engine.pub

          echo "CLOUDSDK_COMPUTE_SSH_KEY_FILE=$HOME/.ssh/google_compute_engine" >> "$GITHUB_ENV"

          echo "✅ SSH key loaded from VM_SSH_PRIVATE_KEY secret"
          ls -la ~/.ssh

      - name: Provision GitHub deploy key on runner
        run: |
          set -Eeuo pipefail
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/github_deploy_key
          chmod 600 ~/.ssh/github_deploy_key
          ssh-keygen -y -f ~/.ssh/github_deploy_key > ~/.ssh/github_deploy_key.pub
          chmod 644 ~/.ssh/github_deploy_key.pub
          echo "✅ DEPLOY_KEY is a valid SSH private key"
          echo "📌 Deploy key fingerprint (must match a key at github.com/.../settings/keys):"
          ssh-keygen -lf ~/.ssh/github_deploy_key.pub
          SSH_TEST="$(ssh -i ~/.ssh/github_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -T git@github.com 2>&1 || true)"
          echo "$SSH_TEST"
          if ! echo "$SSH_TEST" | grep -qiE 'successfully authenticated|does not provide shell access'; then
            echo "❌ DEPLOY_KEY secret does not match any deploy key on the repo"
            exit 1
          fi
          echo "✅ DEPLOY_KEY authenticated with GitHub"

      - name: Debug — GCP VM & IAP diagnostics
        run: |
          set -euxo pipefail
          echo "Project: $(gcloud config get-value project)"
          echo "Auth account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          echo "Instance describe:"
          gcloud compute instances describe "${{ env.VM_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --format="yaml(name,status,zone,networkInterfaces,tags,metadata.items[].key)"
          echo "Firewall rules allowing tcp:22:"
          gcloud compute firewall-rules list \
            --filter="allowed:tcp:22" \
            --format="table(name,network,sourceRanges,allowed,targetTags)"
          echo "Is IAP API enabled?"
          gcloud services list --enabled --filter="name:iap.googleapis.com" --format="value(name)" || true
          echo "Serial output (tail):"
          gcloud compute instances get-serial-port-output "${{ env.VM_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" 2>/dev/null | tail -c 2000 || true

      - name: SSH warmup — verify IAP access before deploy
        run: |
          set -Eeuo pipefail
          echo "👤 SSH user: ${{ env.VM_SSH_USER }}"
          echo "🖥️  VM: ${{ env.VM_NAME }}"
          echo "📍 Zone: ${{ env.GCP_ZONE }}"
          echo "📌 Deploying commit: ${{ github.sha }}"

          gcloud compute ssh "${{ env.VM_SSH_USER }}@${{ env.VM_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --tunnel-through-iap \
            --troubleshoot \
            --verbosity=debug \
            --ssh-flag="${{ env.SSH_KEEPALIVE }}" \
            --command="echo '✅ Connected as:'; whoami; hostname"

      - name: Provision GitHub deploy key on VM
        run: |
          set -Eeuo pipefail

          gcloud compute ssh "${{ env.VM_SSH_USER }}@${{ env.VM_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --tunnel-through-iap \
            --ssh-flag="${{ env.SSH_KEEPALIVE }}" \
            --command="
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
            "

          gcloud compute scp ~/.ssh/github_deploy_key \
            "${{ env.VM_SSH_USER }}@${{ env.VM_NAME }}:~/.ssh/id_ed25519_website" \
            --zone="${{ env.GCP_ZONE }}" \
            --tunnel-through-iap \
            --scp-flag="${{ env.SSH_KEEPALIVE }}"

          gcloud compute ssh "${{ env.VM_SSH_USER }}@${{ env.VM_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --tunnel-through-iap \
            --ssh-flag="${{ env.SSH_KEEPALIVE }}" \
            --command='
              set -Eeuo pipefail
              chmod 600 ~/.ssh/id_ed25519_website
              ssh-keygen -y -f ~/.ssh/id_ed25519_website > ~/.ssh/id_ed25519_website.pub
              chmod 644 ~/.ssh/id_ed25519_website.pub
              touch ~/.ssh/config
              awk '\''
                BEGIN { skip=0 }
                /^Host github-website$/ { skip=1; next }
                /^Host / { skip=0 }
                skip==0 { print }
              '\'' ~/.ssh/config > ~/.ssh/config.tmp
              {
                printf "%s\n" \
                  "Host github-website" \
                  "  HostName github.com" \
                  "  User git" \
                  "  IdentityFile ~/.ssh/id_ed25519_website" \
                  "  IdentitiesOnly yes"
              } >> ~/.ssh/config.tmp
              mv ~/.ssh/config.tmp ~/.ssh/config
              chmod 600 ~/.ssh/config
              ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
              git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519_website -o IdentitiesOnly=yes"
              SSH_TEST="$(ssh -T git@github-website 2>&1 || true)"
              echo "$SSH_TEST"
              if ! echo "$SSH_TEST" | grep -qiE "successfully authenticated|does not provide shell access"; then
                echo "❌ GitHub SSH auth failed on VM — check DEPLOY_KEY matches repo deploy keys"
                exit 1
              fi
              echo "✅ GitHub SSH configured on VM"
            '

      - name: Deploy to GCP VM
        run: |
          set -Eeuo pipefail
          echo "🔐 Deploying lenaAI-website via secure IAP tunnel..."
          echo "📌 Expected commit: ${{ github.sha }}"

          gcloud compute ssh "${{ env.VM_SSH_USER }}@${{ env.VM_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --tunnel-through-iap \
            --ssh-flag="${{ env.SSH_KEEPALIVE }}" \
            --command="
              set -Eeuo pipefail
              trap 'echo \"❌ Remote deploy failed on line \$LINENO\"; exit 1' ERR

              REPO_PATH=\"\$HOME/lenaai-website\"
              REPO_URL=\"git@github-website:abozaid010/lenaai-website.git\"
              EXPECTED_SHA=\"${{ github.sha }}\"

              echo \"🏠 HOME on VM: \$HOME\"
              echo \"📁 Repository path: \$REPO_PATH\"

              if [ ! -f \"\$REPO_PATH/.deploy/deploy.sh\" ]; then
                echo \"📥 Bootstrapping repository (first deploy)...\"
                if [ -e \"\$REPO_PATH\" ]; then
                  rm -rf \"\$REPO_PATH\"
                fi
                mkdir -p \"\$(dirname \"\$REPO_PATH\")\"
                git clone --branch main --single-branch \"\$REPO_URL\" \"\$REPO_PATH\"
              fi

              export REPO_PATH REPO_URL EXPECTED_SHA

              if [ -f \"\$REPO_PATH/.deploy/sync-repo.sh\" ]; then
                bash \"\$REPO_PATH/.deploy/sync-repo.sh\"
              else
                echo \"⚠️  sync-repo.sh missing — inline git sync (legacy VM)\"
                cd \"\$REPO_PATH\"
                git -c safe.directory=\"\$REPO_PATH\" remote set-url origin \"\$REPO_URL\"
                git -c safe.directory=\"\$REPO_PATH\" fetch origin main --prune
                git -c safe.directory=\"\$REPO_PATH\" checkout main
                git -c safe.directory=\"\$REPO_PATH\" reset --hard origin/main
                git -c safe.directory=\"\$REPO_PATH\" clean -fd
                DEPLOYED_SHA=\$(git -c safe.directory=\"\$REPO_PATH\" rev-parse HEAD)
                echo \"📌 VM commit: \$DEPLOYED_SHA\"
                if [ \"\$DEPLOYED_SHA\" != \"\$EXPECTED_SHA\" ]; then
                  echo \"❌ Commit mismatch — deploy aborted.\"
                  exit 1
                fi
              fi

              bash \"\$REPO_PATH/.deploy/deploy.sh\"
            "
