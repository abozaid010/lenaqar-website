# /etc/nginx/sites-available/lenaqar — BOOTSTRAP (HTTP only, before the first
# Let's Encrypt certificate exists). Replace with lenaqar.conf after certbot.
server {
    listen 80;
    listen [::]:80;
    server_name lenaqar.com www.lenaqar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 12M;

    location / {
        proxy_pass http://lenaqar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
