# /etc/nginx/sites-available/lenaqar (symlinked into sites-enabled).
# lenaqar.com is served straight from the VPS (DNS at Namecheap, no Cloudflare).
# TLS: Let's Encrypt via certbot webroot; the certbot timer renews and a
# deploy hook reloads nginx. Canonical host: https://www.lenaqar.com.
# X-Forwarded-For is OVERWRITTEN with the socket address so clients cannot
# spoof the IP the app's rate limiters key on.

server {
    listen 80;
    listen [::]:80;
    server_name lenaqar.com www.lenaqar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://www.lenaqar.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lenaqar.com;

    ssl_certificate     /etc/letsencrypt/live/lenaqar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lenaqar.com/privkey.pem;

    return 308 https://www.lenaqar.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lenaqar.com;

    ssl_certificate     /etc/letsencrypt/live/lenaqar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lenaqar.com/privkey.pem;

    # Server actions accept up to 10 MB (next.config.mjs bodySizeLimit).
    client_max_body_size 12M;

    location / {
        proxy_pass http://lenaqar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
